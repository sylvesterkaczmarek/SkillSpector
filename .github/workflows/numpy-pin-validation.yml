name: CUDA nightly NumPy pin validation
on:
  push:
    branches: [validation/nvidia-395-2803-20260910]
    paths: [.github/workflows/numpy-pin-validation.yml]
permissions:
  contents: read
jobs:
  cancel-superseded-validation:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop the superseded full-checkout validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 34508589470 --repo sylvesterkaczmarek/SkillSpector
  numpy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the pinned script and apply the scoped change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/ci/tools artifacts
          curl --fail --location --max-time 60 --retry 2 https://raw.githubusercontent.com/NVIDIA/cuda-python/53d74520ccdf3f842dfd7e2bdec6bc4328af06ed/ci/tools/run-tests > source/ci/tools/run-tests
          cp source/ci/tools/run-tests artifacts/run-tests-original
          cd source
          git init -q
          git config core.autocrlf false
          git add ci/tools/run-tests
          python - <<'PY'
          from pathlib import Path
          p = Path('ci/tools/run-tests')
          text = p.read_text()
          comment = '      # numpy<2.5: numba-cuda-mlir 0.4.0 registers np.row_stack, which was\n      # removed in NumPy 2.5. See NVIDIA/numba-cuda-mlir#154.\n'
          pin = '        "numpy<2.5"\n'
          assert text.count(comment) == 1 and text.count(pin) == 1
          p.write_text(text.replace(comment, '').replace(pin, ''), newline='\n')
          PY
          bash -n ci/tools/run-tests
          git diff --check
          git diff > ../artifacts/cuda-python-2803.patch
          cp ci/tools/run-tests ../artifacts/run-tests
      - name: Compare actual install arguments for all optional nightly modes
        shell: bash
        run: |
          python - <<'PY'
          import itertools, json, os, pathlib, subprocess, tempfile
          scripts = [pathlib.Path('artifacts/run-tests-original').resolve(), pathlib.Path('source/ci/tools/run-tests').resolve()]
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name in ('cuda_pathfinder', 'cuda_bindings', 'cuda_core', 'bin'):
                  (root / name).mkdir()
              for name in ('cuda_pathfinder', 'cuda_bindings', 'cuda_core'):
                  (root / name / (name + '-0.0.0-py3-none-any.whl')).touch()
              pip = root / 'bin' / 'pip'
              pip.write_text('#!/usr/bin/env bash\npython -c \'import json,os,sys; open(os.environ["PIP_LOG"],"a").write(json.dumps(sys.argv[1:])+"\\n")\' "$@"\nif [[ "$1" == "show" ]]; then echo "Version: 0.4.1"; fi\n', newline='\n')
              pip.chmod(0o755)
              cases = 0
              changed = 0
              for cuda, mode, bindings, local in itertools.product(
                  ('12.9.1', '13.3.0'),
                  ('nightly-numba-cuda-mlir', 'nightly-numba-cuda', 'nightly-pytorch'),
                  ('main', 'published'), ('0', '1')
              ):
                  env = dict(os.environ, PATH=str(root/'bin')+os.pathsep+os.environ['PATH'],
                      PIP_LOG=str(root/'pip.jsonl'), CUDA_VER=cuda,
                      CUDA_BINDINGS_ARTIFACTS_DIR=(root/'cuda_bindings').as_posix(),
                      CUDA_CORE_ARTIFACTS_DIR=(root/'cuda_core').as_posix(),
                      BINDINGS_SOURCE=bindings, LOCAL_CTK=local,
                      TEST_CUDA_MINOR=cuda.split('.')[1], TORCH_VER='latest', TORCH_CUDA='cu'+cuda.split('.')[0],
                      GITHUB_ENV=str(root/'github-env'))
                  outputs = []
                  for script in scripts:
                      (root/'pip.jsonl').write_text('')
                      p = subprocess.run(['bash', script.as_posix(), mode], cwd=root, env=env, text=True, capture_output=True, timeout=30)
                      assert p.returncode == 0, (cuda, mode, bindings, local, p.stdout, p.stderr)
                      outputs.append([json.loads(line) for line in (root/'pip.jsonl').read_text().splitlines()])
                  expected = outputs[0]
                  if mode == 'nightly-numba-cuda-mlir':
                      assert sum(args.count('numpy<2.5') for args in expected) == 1
                      expected = [[a for a in args if a != 'numpy<2.5'] for args in expected]
                      changed += 1
                  assert outputs[1] == expected, (cuda, mode, bindings, local, outputs)
                  cases += 1
              result = f'{cases} install-path comparisons passed; only {changed} MLIR configurations changed'
              print(result)
              pathlib.Path('artifacts/dispatch-validation.txt').write_text(result+'\n')
          PY
      - name: Verify published NumPy and MLIR import compatibility
        shell: bash
        run: |
          python -m pip install 'numpy>=2.5' 'numba-cuda-mlir>=0.4.1' packaging
          python -m pip check
          python - <<'PY'
          import importlib.metadata as md
          import numpy as np
          from pathlib import Path
          from packaging.version import Version
          assert Version(np.__version__) >= Version('2.5')
          assert Version(md.version('numba-cuda-mlir')) >= Version('0.4.1')
          assert not hasattr(np, 'row_stack')
          from numba_cuda_mlir import cuda
          result = f'NumPy {np.__version__}; numba-cuda-mlir {md.version("numba-cuda-mlir")}; CUDA module import passed without np.row_stack'
          print(result)
          Path('artifacts/import-validation.txt').write_text(result+'\n')
          PY
          python -m pip list | tee artifacts/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-python-2803-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
